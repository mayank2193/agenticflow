name: Agentic Test Pipeline

# Generic, reusable 3-stage pipeline - not tied to any specific requirements doc:
#   1. planner   - read a requirements PDF/DOCX and generate/refresh test cases (kane-cli generate)
#   2. authoring - author + export up to max_tests_to_author of the generated *_test.md files as
#                  standalone Playwright code (kane-cli testmd run --code-export)
#   3. execution - re-run the same selected tests against LambdaTest and produce a build view
#
# Note on execution: it re-runs each *_test.md via `kane-cli testmd run` rather than executing
# the exported Playwright file directly (e.g. `node test.js`). The exported file hardcodes the
# tcId/build from its authoring session, and replaying it standalone gets rejected by LambdaTest
# with "Test case validation failed: bad request" - that combination is only valid inside a fresh
# kane-cli-managed session, not a bare CDP replay. `kane-cli testmd run` creates a new session each
# time and is the mechanism proven to actually reach LambdaTest and produce a build/share_url.
#
# Works two ways:
#   - Directly in this repo: Actions tab > "Agentic Test Pipeline" > Run workflow, optionally
#     overriding the inputs below (leave requirements_doc blank to auto-detect the first
#     PDF/DOCX found in the repo root).
#   - As a reusable workflow from another workflow in this repo (or any repo that checks this
#     one out), e.g.:
#
#       jobs:
#         tests:
#           uses: mayank2193/agenticflow/.github/workflows/agentic-test-pipeline.yml@master
#           with:
#             requirements_doc: docs/my-new-prd.pdf
#           secrets: inherit
#
# Required secrets (repo Settings > Secrets and variables > Actions, or passed via `secrets: inherit`):
#   KANE_USERNAME, KANE_ACCESS_KEY   - kane-cli basic-auth credentials (same as `kane-cli login`)
#   LT_USERNAME, LT_ACCESS_KEY       - LambdaTest credentials used by the exported code
#
# Manual-only by default (planner/authoring call a paid AI generation API) - add a push/PR
# trigger once you're happy with the cost profile for a given repo.

on:
  workflow_dispatch:
    inputs:
      requirements_doc:
        description: "Path to the requirements PDF/DOCX (blank = auto-detect first one in repo root)"
        required: false
        default: ""
      generation_objective:
        description: "Instruction passed to kane-cli generate"
        required: false
        default: "generate test cases for the requirements in the attached document, covering positive, negative, and edge cases for each functional requirement"
      test_language:
        description: "Language for the exported automation code"
        required: false
        default: "javascript"
        type: choice
        options:
          - javascript
          - python
      max_tests_to_author:
        description: "Cap on how many planner-generated tests get authored (0 = author all of them)"
        required: false
        default: 0
        type: number
  workflow_call:
    inputs:
      requirements_doc:
        type: string
        required: false
        default: ""
      generation_objective:
        type: string
        required: false
        default: "generate test cases for the requirements in the attached document, covering positive, negative, and edge cases for each functional requirement"
      test_language:
        type: string
        required: false
        default: "javascript"
      max_tests_to_author:
        type: number
        required: false
        default: 0
    secrets:
      KANE_USERNAME:
        required: true
      KANE_ACCESS_KEY:
        required: true
      LT_USERNAME:
        required: true
      LT_ACCESS_KEY:
        required: true

jobs:
  planner:
    name: Planner - Test Creation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest

      - name: Authenticate kane-cli
        run: |
          kane-cli login --username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}"

      - name: Resolve requirements document
        id: resolve
        run: |
          doc="${{ inputs.requirements_doc }}"
          if [ -z "$doc" ]; then
            doc=$(find . -maxdepth 2 \( -iname '*.pdf' -o -iname '*.docx' \) | head -n1)
          fi
          if [ -z "$doc" ]; then
            echo "::error::No requirements_doc input given and no PDF/DOCX found in repo root." >&2
            exit 1
          fi
          if [ ! -f "$doc" ]; then
            echo "::error::requirements_doc '$doc' is not a file in the checked-out repo. Pass a path relative to the repo root (e.g. 'Airbnb_Search_Routing_PRD.pdf'), not a github.com URL." >&2
            exit 1
          fi
          echo "Using requirements document: $doc"
          echo "doc=$doc" >> "$GITHUB_OUTPUT"

      - name: Generate test cases from requirements document
        id: generate
        run: |
          set -e -o pipefail
          output=$(kane-cli generate "${{ inputs.generation_objective }}" \
            --files "${{ steps.resolve.outputs.doc }}" \
            --agent | tee /dev/stderr)
          req_id=$(printf '%s\n' "$output" | grep '"type":"generate_done"' | grep -o '"request_id":"[0-9]*"' | grep -o '[0-9]*' | tail -n1)
          if [ -z "$req_id" ]; then
            echo "::error::Could not find a request_id in kane-cli generate output." >&2
            exit 1
          fi
          echo "Generated request id: $req_id"
          echo "request_id=$req_id" >> "$GITHUB_OUTPUT"

      - name: Save generated test cases
        run: |
          kane-cli generate --save --req "${{ steps.generate.outputs.request_id }}" --agent

      - name: Upload generated test suite
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: .testmuai/tests/**/*_test.md
          retention-days: 14

  authoring:
    name: Authoring - Automation Code Generation
    needs: planner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: .testmuai/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest

      - name: Authenticate kane-cli
        run: |
          kane-cli login --username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}"

      - name: Select tests to author (respecting max_tests_to_author)
        id: select
        run: |
          set -e
          mapfile -d '' -t all_tests < <(find .testmuai/tests -name '*_test.md' -print0 | sort -z)
          total=${#all_tests[@]}
          max="${{ inputs.max_tests_to_author }}"
          if [ -n "$max" ] && [ "$max" -gt 0 ] && [ "$max" -lt "$total" ]; then
            echo "Planner produced $total tests; authoring is capped at $max."
            selected=("${all_tests[@]:0:$max}")
          else
            echo "Planner produced $total tests; authoring all of them (no cap, or cap >= total)."
            selected=("${all_tests[@]}")
          fi
          printf '%s\0' "${selected[@]}" > selected_tests.txt
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"

      - name: Sync selected tests to TMS and export their automation code
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          set -e
          echo "Authoring ${{ steps.select.outputs.count }} test(s)."
          failed_count=0
          while IFS= read -r -d '' test_file; do
            echo "Running + exporting: $test_file"
            # A failed assertion/replay still syncs the test and exports its code
            # (kane-cli just exits non-zero to report the failure) - don't let a
            # single failing test abort authoring for the rest of the suite.
            if ! kane-cli testmd run "$test_file" \
              --headless \
              --agent \
              --code-export \
              --code-language "${{ inputs.test_language }}"; then
              echo "::warning::Test failed (assertions or replay) but code was still exported: $test_file"
              failed_count=$((failed_count + 1))
            fi
          done < selected_tests.txt
          if [ "$failed_count" -gt 0 ]; then
            echo "$failed_count of ${{ steps.select.outputs.count }} test(s) failed during authoring (code was exported for all of them regardless)."
          fi

      - name: Upload exported automation code
        uses: actions/upload-artifact@v4
        with:
          name: automation-code
          path: .testmuai/tests/**/playwright-${{ inputs.test_language }}-code/**
          retention-days: 14

      - name: Upload selected tests list
        uses: actions/upload-artifact@v4
        with:
          name: selected-tests
          path: selected_tests.txt
          retention-days: 14

  execution:
    name: Execution - Run on LambdaTest
    needs: authoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: .testmuai/tests

      - uses: actions/download-artifact@v4
        with:
          name: selected-tests
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest

      - name: Authenticate kane-cli
        run: |
          kane-cli login --username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}"

      - name: Re-run each selected test on LambdaTest
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          set -e
          failed_count=0
          total=0
          while IFS= read -r -d '' test_file; do
            total=$((total + 1))
            echo "Running: $test_file"
            if ! kane-cli testmd run "$test_file" --headless --agent; then
              echo "::warning::Test failed on LambdaTest: $test_file"
              failed_count=$((failed_count + 1))
            fi
          done < selected_tests.txt
          echo "$((total - failed_count)) of $total test(s) passed on LambdaTest."

      - name: Build view
        run: |
          echo "Results are published as a LambdaTest Test Manager build - see https://test-manager.lambdatest.com/ for the project associated with the authenticated kane-cli/LambdaTest account."
